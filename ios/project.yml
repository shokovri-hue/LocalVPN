# Проект Xcode для iPhone. Файл .xcodeproj не хранится в репозитории — его создаёт XcodeGen:
#   cd ios && ./scripts/build-wg-go.sh && xcodegen generate
name: LocalVPN
options:
  bundleIdPrefix: app.localvpn
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

packages:
  Tun2SocksKit:
    url: https://github.com/EbrahimTahernejad/Tun2SocksKit
    exactVersion: 5.16.0

targets:
  LocalVPN:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: LocalVPN
      - path: Shared
      # Та же страница, шрифты и скрипты, что и в Android-версии
      - path: ../app/src/main/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.localvpn
        PRODUCT_NAME: LocalVPN
        INFOPLIST_FILE: LocalVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocalVPN/LocalVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnel
      - sdk: NetworkExtension.framework

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - "**/module.modulemap"
          - "**/COPYING"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.localvpn.tunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        # Модули WireGuardKitC (C-код ключей) и WireGuardKitGo (движок AmneziaWG на Go)
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/PacketTunnel/WireGuardKitC $(PROJECT_DIR)/vendor/WireGuardKitGo"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/PacketTunnel/WireGuardKitC $(PROJECT_DIR)/vendor/WireGuardKitGo"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/vendor/WireGuardKitGo/out"
        OTHER_LDFLAGS: "-lwg-go -lresolv"
    dependencies:
      - package: Tun2SocksKit
        product: Tun2SocksKit
      - sdk: NetworkExtension.framework
