name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # кнопка «Run workflow» во вкладке Actions

permissions:
  contents: write # чтобы выложить APK в раздел Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Подготовить ключ подписи
        env:
          # Берём значение из Secrets, а если его там нет — из Variables
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
          KS_SECRET_SET: ${{ secrets.KEYSTORE_BASE64 != '' }}
          KS_VAR_SET: ${{ vars.KEYSTORE_BASE64 != '' }}
          PW_SET: ${{ (secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD) != '' }}
          ALIAS_SET: ${{ (secrets.KEY_ALIAS || vars.KEY_ALIAS) != '' }}
        run: |
          echo "Проверка (значения не показываются):"
          echo "  KEYSTORE_BASE64 в Secrets: $KS_SECRET_SET, в Variables: $KS_VAR_SET, длина: ${#KEYSTORE_BASE64}"
          echo "  KEYSTORE_PASSWORD задан: $PW_SET"
          echo "  KEY_ALIAS задан: $ALIAS_SET"
          if [ -n "$KEYSTORE_BASE64" ]; then
            # убираем пробелы и переносы строк, если они случайно попали при вставке
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::KEYSTORE_BASE64 вставлен не полностью или с лишними символами"; exit 1; }
            echo "LOCALVPN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Ключ подписи найден"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан. APK подписан временным ключом и не обновится поверх прошлой версии. Инструкция — в README."
          fi

      - name: Собрать APK
        env:
          LOCALVPN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          LOCALVPN_KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
          YANDEX_AD_UNIT_ID: ${{ vars.YANDEX_AD_UNIT_ID }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Переименовать файл
        run: cp app/build/outputs/apk/release/app-release.apk "LocalVPN-1.0.${{ github.run_number }}.apk"

      - name: Сохранить APK во вкладке Actions
        uses: actions/upload-artifact@v4
        with:
          name: LocalVPN-apk
          path: LocalVPN-*.apk

      - name: Выложить APK в Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" LocalVPN-*.apk \
            --title "LocalVPN 1.0.${{ github.run_number }}" \
            --notes "Скачайте файл LocalVPN-1.0.${{ github.run_number }}.apk на телефон и откройте его, чтобы установить." \
            --latest
